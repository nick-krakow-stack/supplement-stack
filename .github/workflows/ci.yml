name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc -p tsconfig.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Functions dependencies required by integration tests
        run: npm install
        working-directory: functions
      - run: npm run lint --if-present
      - run: npm run test --if-present -- --run
      - run: npm run build

      - name: Verify build output
        run: |
          if [ -d dist ]; then
            echo "Build output exists at dist/"
            ls -la dist/ | head -10
          else
            echo "No dist directory found"
            exit 1
          fi

  script-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/admin-browser-smoke.mjs
      - run: node --check scripts/user-browser-smoke.mjs
      - name: Verify guarded legacy article corrections
        run: node --test scripts/article-legacy-field-correction.test.mjs scripts/article-authoritative-correction.test.mjs
      - name: Verify guarded central legal document migration
        run: node --test scripts/legal-documents-migration.test.mjs
      - name: Verify publication metadata length gate
        run: node --test scripts/article-seo-length-gate.test.mjs
