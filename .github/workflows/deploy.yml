name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: production-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Install functions dependencies
        run: cd functions && npm install

      - name: Run frontend tests
        run: cd frontend && npm test -- --run

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_CREATOR_STACK_SHARING_ENABLED: 'true'

      - name: Verify build output
        run: |
          if [ -d frontend/dist ]; then
            echo "✅ Build output exists at frontend/dist/"
            ls -la frontend/dist/ | head -10
          else
            echo "❌ Build failed - no dist directory found"
            exit 1
          fi

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply supplementstack-production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Copy functions to build output
        run: cp -r functions frontend/dist/

      - name: Deploy to Cloudflare Pages
        id: pages_deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: supplementstack
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
          compatibilityDate: '2024-09-23'

      - name: Activate postdeploy D1 migrations
        run: npx wrangler d1 migrations apply supplementstack-production --remote --config wrangler.postdeploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Drain postdeploy creator notifications
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRAIN_ORIGIN: ${{ steps.pages_deploy.outputs.url }}
        run: |
          set -euo pipefail
          DRAIN_RUN_KEY="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DRAIN_NONCE="$(openssl rand -hex 32)"
          DRAIN_HASH="$(printf '%s' "${DRAIN_NONCE}" | sha256sum | cut -d ' ' -f 1)"
          npx wrangler d1 execute supplementstack-production --remote --command "
            INSERT INTO creator_share_notification_drain_runs (
              run_key, capability_hash, status
            )
            SELECT '${DRAIN_RUN_KEY}', '${DRAIN_HASH}', 'ready'
            FROM creator_share_workflow_rollouts
            WHERE rollout_key = 'creator_portfolio_v1' AND phase = 'active';
          "
          DRAIN_ORIGIN="${DRAIN_ORIGIN%/}"
          DRAIN_RESPONSE_FILE="${RUNNER_TEMP}/creator-notification-drain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          for _ in $(seq 1 30); do
            if ! DRAIN_HTTP_STATUS="$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 20 \
              --output "${DRAIN_RESPONSE_FILE}" \
              --write-out '%{http_code}' \
              --request POST "${DRAIN_ORIGIN}/api/creator-sharing/internal/notification-drain" \
              --header "Authorization: Bearer ${DRAIN_NONCE}" \
              --header "X-Creator-Drain-Run: ${DRAIN_RUN_KEY}")"; then
              sleep 2
              continue
            fi
            DRAIN_RESPONSE="$(cat "${DRAIN_RESPONSE_FILE}")"
            if [[ "${DRAIN_HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
              if node -e "const value=JSON.parse(process.argv[1]); process.exit(value.complete === true ? 0 : 1)" "${DRAIN_RESPONSE}"; then
                exit 0
              fi
              sleep 2
              continue
            fi
            case "${DRAIN_HTTP_STATUS}" in
              404|429|502|504)
                sleep 2
                continue
                ;;
            esac
            echo "Creator notification drain failed with HTTP ${DRAIN_HTTP_STATUS}." >&2
            exit 1
          done
          echo "Creator notification drain did not finish." >&2
          exit 1

      - name: Deployment complete
        run: echo "✅ Deployment to Cloudflare Pages complete!"
