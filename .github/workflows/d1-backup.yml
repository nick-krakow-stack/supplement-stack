name: D1 Daily Backup

on:
  schedule:
    - cron: '0 3 * * *'   # täglich 03:00 UTC
  workflow_dispatch:        # manueller Trigger zum Testen

concurrency:
  group: d1-production-backup-and-trash-purge
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export D1 database
        run: |
          BACKUP_FILE="d1-backup-${{ github.run_id }}-$(date +%Y%m%d).sql"
          npx wrangler d1 export supplementstack-production --remote --output "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload backup as artifact (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      # Expired trash is purged only after the recoverable database export was
      # uploaded successfully. One fixed cutoff makes before/delete/after exact.
      - name: Purge stacks whose 7-day recovery window expired
        shell: bash
        run: |
          set -euo pipefail
          PURGE_CUTOFF="$(date -u +'%Y-%m-%d %H:%M:%S')"
          BEFORE_JSON="$(npx wrangler d1 execute supplementstack-production --remote --json --command "SELECT COUNT(*) AS expired_count FROM stacks WHERE deleted_at IS NOT NULL AND delete_purge_after IS NOT NULL AND delete_purge_after <= '${PURGE_CUTOFF}';")"
          BEFORE_COUNT="$(jq -er '.[0].results[0].expired_count' <<<"$BEFORE_JSON")"

          PURGE_JSON="$(npx wrangler d1 execute supplementstack-production --remote --json --command "DELETE FROM stacks WHERE deleted_at IS NOT NULL AND delete_purge_after IS NOT NULL AND delete_purge_after <= '${PURGE_CUTOFF}';")"
          PURGED_COUNT="$(jq -er '.[0].meta.changes' <<<"$PURGE_JSON")"

          AFTER_JSON="$(npx wrangler d1 execute supplementstack-production --remote --json --command "SELECT COUNT(*) AS expired_count FROM stacks WHERE deleted_at IS NOT NULL AND delete_purge_after IS NOT NULL AND delete_purge_after <= '${PURGE_CUTOFF}';")"
          AFTER_COUNT="$(jq -er '.[0].results[0].expired_count' <<<"$AFTER_JSON")"

          {
            echo "### Stack-Papierkorb"
            echo "- Stichtag (UTC): ${PURGE_CUTOFF}"
            echo "- Vorher abgelaufen: ${BEFORE_COUNT}"
            echo "- Gelöscht: ${PURGED_COUNT}"
            echo "- Danach abgelaufen: ${AFTER_COUNT}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ "$PURGED_COUNT" != "$BEFORE_COUNT" || "$AFTER_COUNT" != "0" ]]; then
            echo "Papierkorb-Purge ist inkonsistent; Workflow schlägt sichtbar fehl." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
