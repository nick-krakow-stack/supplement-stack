<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplement Stack</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const url = new URL(window.location.href);
        if (url.pathname === '/wissen' && !url.searchParams.has('cfcheck')) {
          const request = fetch('/api/knowledge', {
            headers: { Accept: 'application/json' },
          });
          request.catch(() => undefined);
          window.__knowledgeOverviewRequest = request;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
