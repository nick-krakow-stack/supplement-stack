<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Was bei zu viel vorgebildetem Vitamin A passieren kann</title>
  <desc id="desc">Eine einfache Übersicht zu Leber, Haut, Kopf, Knochen und Schwangerschaft.</desc>
  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Wenn es dauerhaft zu viel wird</text>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="20" fill="#475569">Das Risiko betrifft vor allem vorgebildetes Vitamin A aus Retinol oder Retinylestern, nicht normales Gemüse.</text>
  <g font-family="Arial, sans-serif">
    <rect x="65" y="180" width="205" height="175" rx="24" fill="#fee2e2" stroke="#fca5a5" stroke-width="4"/>
    <text x="168" y="232" text-anchor="middle" font-size="25" font-weight="700" fill="#991b1b">Leber</text>
    <text x="168" y="276" text-anchor="middle" font-size="18" fill="#7f1d1d">speichert viel</text>
    <text x="168" y="302" text-anchor="middle" font-size="18" fill="#7f1d1d">Vitamin A</text>
    <rect x="315" y="180" width="205" height="175" rx="24" fill="#ffedd5" stroke="#fdba74" stroke-width="4"/>
    <text x="418" y="232" text-anchor="middle" font-size="25" font-weight="700" fill="#9a3412">Haut</text>
    <text x="418" y="276" text-anchor="middle" font-size="18" fill="#7c2d12">kann trocken</text>
    <text x="418" y="302" text-anchor="middle" font-size="18" fill="#7c2d12">oder gereizt sein</text>
    <rect x="565" y="180" width="205" height="175" rx="24" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="4"/>
    <text x="668" y="232" text-anchor="middle" font-size="25" font-weight="700" fill="#075985">Kopf</text>
    <text x="668" y="276" text-anchor="middle" font-size="18" fill="#0c4a6e">Kopfschmerz</text>
    <text x="668" y="302" text-anchor="middle" font-size="18" fill="#0c4a6e">ist möglich</text>
    <rect x="815" y="180" width="205" height="175" rx="24" fill="#fef3c7" stroke="#fcd34d" stroke-width="4"/>
    <text x="918" y="232" text-anchor="middle" font-size="25" font-weight="700" fill="#92400e">Knochen</text>
    <text x="918" y="276" text-anchor="middle" font-size="18" fill="#78350f">werden in Studien</text>
    <text x="918" y="302" text-anchor="middle" font-size="18" fill="#78350f">mitbeobachtet</text>
  </g>
  <rect x="65" y="405" width="955" height="62" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="542" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#991b1b">In der Schwangerschaft ist zu viel vorgebildetes Vitamin A besonders vorsichtig zu betrachten.</text>
</svg>
