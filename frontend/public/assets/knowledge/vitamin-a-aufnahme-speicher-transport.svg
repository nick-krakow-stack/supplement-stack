<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Aufnahme, Speicherung und Transport von Vitamin A</title>
  <desc id="desc">Schematische Darstellung: Vitamin A wird mit Fett aufgenommen, in der Leber gespeichert und über Transporteiweiße zu Geweben gebracht.</desc>
  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Wie Vitamin A durch den Körper geht</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="18" fill="#475569">Vereinfacht: Aufnahme mit Fett, Speicherung in der Leber, Transport über Blut und Eiweiße.</text>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="65" y="170" width="210" height="210" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
    <text x="170" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9a3412">Darm</text>
    <circle cx="130" cy="275" r="36" fill="#f59e0b" opacity="0.25"/>
    <circle cx="170" cy="285" r="34" fill="#f97316" opacity="0.3"/>
    <circle cx="205" cy="265" r="28" fill="#fbbf24" opacity="0.35"/>
    <text x="170" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">Aufnahme zusammen</text>
    <text x="170" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">mit Fettverdauung</text>
  </g>

  <path d="M300 275 C340 245, 380 245, 420 275" fill="none" stroke="#d97706" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="440" y="150" width="260" height="250" rx="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="3"/>
    <text x="570" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#166534">Leber</text>
    <path d="M505 286 C520 225, 605 215, 648 258 C684 295, 642 347, 573 344 C525 342, 489 324, 505 286Z" fill="#22c55e" opacity="0.25" stroke="#16a34a" stroke-width="4"/>
    <text x="570" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#14532d">Speicher für</text>
    <text x="570" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#14532d">vorgebildetes Vitamin A</text>
  </g>

  <path d="M725 275 C765 245, 805 245, 845 275" fill="none" stroke="#d97706" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="865" y="170" width="270" height="210" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="1000" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1d4ed8">Blut &amp; Gewebe</text>
    <rect x="930" y="248" width="140" height="42" rx="21" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="1000" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e40af">Transporteiweiße</text>
    <text x="1000" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">Auge, Schleimhäute,</text>
    <text x="1000" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">Haut und Immunsystem</text>
  </g>
</svg>
