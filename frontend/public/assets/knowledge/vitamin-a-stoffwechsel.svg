<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">So wird Vitamin A im Körper genutzt</title>
  <desc id="desc">Ein einfacher Ablauf: Essen, Darm, Leber, Blut und Körperzellen.</desc>
  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">So wird Vitamin A im Körper genutzt</text>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="20" fill="#475569">Vitamin A kommt aus dem Essen, wird im Darm aufgenommen, in der Leber gespeichert und zu den Körperzellen gebracht.</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="185" width="190" height="170" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="4"/>
    <text x="155" y="238" text-anchor="middle" font-size="26" font-weight="700" fill="#9a3412">Essen</text>
    <text x="155" y="282" text-anchor="middle" font-size="18" fill="#7c2d12">Leber, Eier, Milch</text>
    <text x="155" y="308" text-anchor="middle" font-size="18" fill="#7c2d12">oder Pflanzenfarben</text>
    <path d="M275 270 H360" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
    <path d="M342 250 L370 270 L342 290" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="390" y="185" width="190" height="170" rx="24" fill="#ecfeff" stroke="#67e8f9" stroke-width="4"/>
    <text x="485" y="238" text-anchor="middle" font-size="26" font-weight="700" fill="#155e75">Darm</text>
    <text x="485" y="282" text-anchor="middle" font-size="18" fill="#164e63">Aufnahme mit Fett</text>
    <text x="485" y="308" text-anchor="middle" font-size="18" fill="#164e63">aus der Nahrung</text>
    <path d="M605 270 H690" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
    <path d="M672 250 L700 270 L672 290" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="720" y="185" width="190" height="170" rx="24" fill="#ecfdf5" stroke="#86efac" stroke-width="4"/>
    <text x="815" y="238" text-anchor="middle" font-size="26" font-weight="700" fill="#166534">Leber</text>
    <text x="815" y="282" text-anchor="middle" font-size="18" fill="#14532d">speichert Vitamin A</text>
    <text x="815" y="308" text-anchor="middle" font-size="18" fill="#14532d">für später</text>
    <path d="M935 270 H1020" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
    <path d="M1002 250 L1030 270 L1002 290" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1040" y="185" width="110" height="170" rx="24" fill="#eef2ff" stroke="#a5b4fc" stroke-width="4"/>
    <text x="1095" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#3730a3">Zellen</text>
    <text x="1095" y="282" text-anchor="middle" font-size="17" fill="#312e81">Auge</text>
    <text x="1095" y="306" text-anchor="middle" font-size="17" fill="#312e81">Haut</text>
    <text x="1095" y="330" text-anchor="middle" font-size="17" fill="#312e81">Abwehr</text>
  </g>
  <rect x="60" y="410" width="1090" height="62" rx="18" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="605" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#92400e">Wichtig: Weil Vitamin A gespeichert werden kann, ist dauerhaft zu viel vorgebildetes Vitamin A nicht harmlos.</text>
</svg>
