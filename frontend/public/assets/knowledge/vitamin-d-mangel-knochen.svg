<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Vitamin-D-Mangel kann den Knochenstoffwechsel schwächen</title>
  <desc id="desc">Eine einfache Ursache-Folge-Grafik von wenig UVB-Licht über niedrigen 25(OH)D-Status zu gestörter Calciumsteuerung und schwächerer Knochenmineralisierung.</desc>
  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Wenn Vitamin D zu niedrig ist</text>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="20" fill="#475569">Der Statusmarker sinkt. Dann kann der Calcium- und Knochenstoffwechsel aus dem Gleichgewicht geraten.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="175" width="230" height="190" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="4"/>
    <path d="M128 258 C150 222 202 222 224 258" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <path d="M118 288 H235" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <text x="185" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">wenig UVB</text>
    <text x="185" y="330" text-anchor="middle" font-size="18" fill="#1e3a8a">Winter, Innenräume</text>

    <path d="M325 270 H405" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M387 250 L415 270 L387 290" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="435" y="175" width="230" height="190" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="4"/>
    <circle cx="515" cy="270" r="44" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
    <text x="515" y="277" text-anchor="middle" font-size="24" font-weight="700" fill="#9a3412">25</text>
    <path d="M570 225 V315" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
    <path d="M548 292 L570 318 L592 292" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="550" y="222" text-anchor="middle" font-size="25" font-weight="700" fill="#9a3412">25(OH)D</text>
    <text x="550" y="340" text-anchor="middle" font-size="18" fill="#7c2d12">Status fällt</text>

    <path d="M690 270 H770" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M752 250 L780 270 L752 290" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="800" y="175" width="330" height="190" rx="24" fill="#f0fdf4" stroke="#86efac" stroke-width="4"/>
    <g stroke="#16a34a" stroke-width="12" stroke-linecap="round">
      <path d="M925 240 C870 220 850 295 910 302"/>
      <path d="M970 240 C1025 220 1045 295 985 302"/>
      <path d="M920 241 H975"/>
      <path d="M913 302 H990"/>
    </g>
    <circle cx="885" cy="220" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <circle cx="1015" cy="220" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <text x="965" y="342" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Knochen</text>
    <text x="965" y="392" text-anchor="middle" font-size="18" fill="#14532d">Mineralisierung kann leiden</text>
  </g>

  <rect x="110" y="438" width="980" height="50" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">Statusdaten beschreiben Versorgung. Eine Diagnose braucht medizinischen Kontext.</text>
</svg>
