<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Möglicher Verlauf eines Vitamin-A-Mangels</title>
  <desc id="desc">Zeitachse mit sinkenden Speichern, Nachtblindheit, Augenoberflächenschäden und schweren Mangelzeichen.</desc>
  <rect width="1200" height="560" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Vitamin-A-Mangel: warum er oft schrittweise sichtbar wird</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="18" fill="#475569">Nicht jede Person durchläuft alle Schritte. Die Grafik zeigt typische Stationen aus Mangel- und Public-Health-Kontexten.</text>

  <line x1="105" y1="300" x2="1095" y2="300" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
  <circle cx="160" cy="300" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="5"/>
  <circle cx="420" cy="300" r="26" fill="#fde68a" stroke="#d97706" stroke-width="5"/>
  <circle cx="680" cy="300" r="26" fill="#fed7aa" stroke="#ea580c" stroke-width="5"/>
  <circle cx="960" cy="300" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/>

  <g font-family="Arial, sans-serif">
    <text x="160" y="205" text-anchor="middle" font-size="23" font-weight="700" fill="#92400e">Speicher sinken</text>
    <text x="160" y="236" text-anchor="middle" font-size="17" fill="#78350f">Leberreserven werden</text>
    <text x="160" y="260" text-anchor="middle" font-size="17" fill="#78350f">langsam kleiner</text>

    <text x="420" y="380" text-anchor="middle" font-size="23" font-weight="700" fill="#92400e">Nachtblindheit</text>
    <text x="420" y="411" text-anchor="middle" font-size="17" fill="#78350f">Sehen bei wenig Licht</text>
    <text x="420" y="435" text-anchor="middle" font-size="17" fill="#78350f">kann schlechter werden</text>

    <text x="680" y="205" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">Augenoberfläche</text>
    <text x="680" y="236" text-anchor="middle" font-size="17" fill="#7c2d12">Trockenheit, Bitot-Flecken</text>
    <text x="680" y="260" text-anchor="middle" font-size="17" fill="#7c2d12">oder Xerophthalmie</text>

    <text x="960" y="380" text-anchor="middle" font-size="23" font-weight="700" fill="#991b1b">Schwere Zeichen</text>
    <text x="960" y="411" text-anchor="middle" font-size="17" fill="#7f1d1d">Hornhautschäden und</text>
    <text x="960" y="435" text-anchor="middle" font-size="17" fill="#7f1d1d">höhere Krankheitslast</text>
  </g>

  <rect x="70" y="480" width="1060" height="54" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="600" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">Besonders wichtig sind geringe Versorgung, Infektionslast, Schwangerschaftskontexte und Kinder in Mangelrisiko-Regionen.</text>
</svg>
